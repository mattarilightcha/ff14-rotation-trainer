# UI モックを nettoge.com のサーバーに仮で置く（docs/DEPLOY.md の簡易版）
# - mock/ か抽出データが変わって push されたとき、または Actions 画面から手動で実行したときに動く
# - 毎回 zip（mock-site）を成果物として残す。SSH で送れない場合は、これを手でアップロードする
# - Secrets が登録されていれば SSH + rsync でサーバーへ送る
name: deploy-mock

on:
  push:
    branches: [main, claude/kind-mayer-h4vdph]
    paths:
      - 'mock/**'
      - 'src/data/ffxiv/**'
      - 'public/icons/**'
      - '.github/workflows/deploy-mock.yml'
  workflow_dispatch:

concurrency:
  group: deploy-mock
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Package mock
        run: node mock/package.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: mock-site
          path: dist-mock/
          retention-days: 14

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: mock
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_MOCK_PATH: ${{ vars.DEPLOY_MOCK_PATH }}
      MOCK_URL: ${{ vars.MOCK_URL }}
    steps:
      - name: Check settings
        id: check
        run: |
          if [ -z "$DEPLOY_HOST" ] || [ -z "$DEPLOY_USER" ] || [ -z "$DEPLOY_MOCK_PATH" ]; then
            echo "::warning::Secrets / Variables が未登録のため、サーバーへの送信を省略しました。成果物 mock-site を手でアップロードしてください（mock/README.md）。"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@v4
        if: steps.check.outputs.skip != 'true'
        with:
          name: mock-site
          path: dist-mock
      - name: Set up SSH
        if: steps.check.outputs.skip != 'true'
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Upload with rsync
        if: steps.check.outputs.skip != 'true'
        run: |
          # 登録値の揺れを吸収する（https:// や末尾の / 、前後の空白、host:port 形式）
          # ssh-keyscan の行（「ホスト 鍵の種類 鍵」）が入っていても、先頭の語をホスト名として使う
          host=$(printf '%s' "$DEPLOY_HOST" | awk 'NF && $1 !~ /^#/ {print $1; exit}')
          host=${host#*://}; host=${host%%/*}; host=${host%%,*}
          case "$host" in \[*\]:*) port=${host##*:}; host=${host#[}; host=${host%%]*} ;; esac
          port=${port:-$(printf '%s' "$DEPLOY_PORT" | tr -d '[:space:]')}
          case "$host" in *:*) port=${port:-${host##*:}}; host=${host%%:*} ;; esac
          port=${port:-22}
          user=$(printf '%s' "$DEPLOY_USER" | tr -d '[:space:]')
          dest=$(printf '%s' "$DEPLOY_MOCK_PATH" | sed 's/[[:space:]]*$//'); dest=${dest%/}
          case "$user" in */*|*@*) echo "::error::DEPLOY_USER にユーザー名以外（/ や @）が含まれています"; exit 1 ;; esac
          [ -n "$host" ] || { echo "::error::DEPLOY_HOST が空です"; exit 1; }
          echo "接続先: ホスト名 ${#host} 文字 / ポート $port / 置き場所 $dest"
          case "$host" in *.*|*:*) ;; *) echo "::error::DEPLOY_HOST からホスト名を読み取れません。ホスト名か IP だけを登録してください"; exit 1 ;; esac
          ssh_cmd="ssh -i $HOME/.ssh/id_deploy -p $port -o StrictHostKeyChecking=yes -o BatchMode=yes"
          $ssh_cmd "$user@$host" "mkdir -p '$dest'"
          rsync -rlptz --delete -e "$ssh_cmd" dist-mock/ "$user@$host:$dest/"
      - name: Smoke check
        if: steps.check.outputs.skip != 'true' && env.MOCK_URL != ''
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' "$MOCK_URL")
          echo "GET $MOCK_URL -> $code"
          test "$code" = "200"
